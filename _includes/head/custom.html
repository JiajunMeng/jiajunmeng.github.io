
<head>

  <!-- ===== Icons / Manifest（原样保留） ===== -->
  <link rel="apple-touch-icon" sizes="180x180" href="images/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32x32.png">
  <link rel="icon" type="image/png" sizes="16x16" href="images/favicon-16x16.png">
  <link rel="manifest" href="images/site.webmanifest">

  <meta name="msapplication-TileColor" content="#000000">
  <meta name="msapplication-TileImage" content="images/mstile-144x144.png?v=M44lzPylqQ">
  <meta name="msapplication-config" content="images/browserconfig.xml?v=M44lzPylqQ">
  <meta name="theme-color" content="#ffffff">

  <!-- Academicons -->
  <link rel="stylesheet" href="assets/css/academicons.css"/>

  <!-- ===== Latin Modern Sans Font ===== -->
  <style>

    @font-face {
      font-family: 'Latin Modern Sans';
      src: url('assets/fonts/lmss10-regular.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    @font-face {
      font-family: 'Latin Modern Sans';
      src: url('assets/fonts/lmss10-bold.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }

    /* ===== Global Font / Line-height ===== */

    body {
      font-family: 'Latin Modern Sans', sans-serif;
      font-size: calc(1.02em);
      line-height: 1.68;

      /* text-align: justify; */
      /* text-justify: inter-word; */
      /* text-align-last: left; */
      /* word-spacing: normal; */
      /* letter-spacing: normal; */
    }

    /* 手机端：字体稍小 + 行距稍松 */
    @media screen and (max-width: 768px) {
      body {
        font-family: 'Latin Modern Sans', sans-serif;
        font-size: 0.9em;
        line-height: 1.55;
      }
    }

    /* 段落优化：限制过度拉伸 */
    p {
      max-width: 100%;
    }

    /* 针对可能过度拉伸的短段落，使用左对齐 */
    p:has(br),
    p.short {
      text-align: left;
    }

    /* 超链接默认不显示颜色 */
    a {
      color: inherit;
      text-decoration: none;
    }

    /* 悬停时显示稍亮的深暗蓝 */
    a:hover {
      color: #5b7c99;
    }

    /* 明确不干扰 MathJax 行距 */
    .MathJax {
      line-height: normal;
    }

    /* ===== 列表缩进与间距 ===== */

    /* 一级列表整体 */
    ul, ol {
      margin-top: 0.25em;
      margin-bottom: 0.25em;
      margin-left: 1.2em;
      padding-left: 0;
      list-style-position: outside;
    }

    /* 一级列表项 */
    ul > li,
    ol > li {
      margin-bottom: 0.25em;
      line-height: 1.65;
    }

    /* 最后一个一级列表项不留空 */
    ul > li:last-child,
    ol > li:last-child {
      margin-bottom: 0;
    }

    /* 二级及以下列表 */
    ul ul,
    ol ul,
    ul ol,
    ol ol {
      margin-top: 0em;
      margin-bottom: 0.4em;
      margin-left: 1.4em;
    }

    /* 二级列表项 */
    ul ul > li,
    ol ul > li,
    ul ol > li,
    ol ol > li {
      margin-bottom: 0.25em;
      line-height: 1.4;
    }

  </style>

  <!-- ===== MathJax Config（必须在主脚本前） ===== -->
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      TeX: {
        equationNumbers: { autoNumber: "all" }
      },
      tex2jax: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        processEscapes: true
      }
    });
  </script>

  <!-- ===== MathJax Core ===== -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML"
    async>
  </script>

</head>
