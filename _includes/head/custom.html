<head>
  <!-- 引入 Google Fonts（可选但推荐） -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;700&family=Roboto:wght@400;500;700&family=Georgia:wght@400;700&display=swap" rel="stylesheet">

  <!-- Academicons -->
  <link rel="stylesheet" href="assets/css/academicons.css"/>

  <style>
    /* ===== 全局字体设置 ===== */
    body {
      font-family: 'Roboto', sans-serif; /* 正文字体 */
      font-size: calc(1.02em);
      line-height: 1.5;
      text-align: justify;
      text-justify: inter-word;
      text-align-last: left;
      word-spacing: normal;
      letter-spacing: normal;
    }

    /* 标题字体 */
    h1, h2, h3, h4, h5, h6 {
      font-family: 'Georgia', serif;
      font-weight: 700;
    }

    /* ===== Navigation 字体 ===== */
    nav#site-nav,
    .masthead__menu-item {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      font-weight: 500;
    }

    /* ===== 作者信息字体 ===== */
    .author__name {
      font-family: 'Georgia', serif;
      font-size: 24px;
      font-weight: bold;
    }

    .author__bio,
    .author__urls-wrapper li,
    .author__urls-wrapper a {
      font-family: 'Roboto', sans-serif;
      font-size: 14px;
    }

    .profile_box {
      font-family: 'Roboto', sans-serif;
    }

    /* ===== 手机端 ===== */
    @media screen and (max-width: 768px) {
      body {
        font-family: 'Roboto', sans-serif;
        font-size: 0.9em;
        line-height: 1.4;
        text-align: justify;
        text-justify: inter-word;
        text-align-last: left;
        word-spacing: normal;
        letter-spacing: normal;
      }

      .author__name {
        font-size: 18px;
      }
    }

    /* ===== 其他优化 ===== */
    a {
      color: inherit;
      text-decoration: none;
    }

    a:hover {
      color: #5b7c99;
    }

    .MathJax {
      line-height: normal;
    }

    /* 列表样式（保持原来的） */
    ul, ol {
      margin-top: 0.15em;
      margin-bottom: 0.15em;
      margin-left: 1.2em;
      padding-left: 0;
      list-style-position: outside;
    }

    ul > li,
    ol > li {
      margin-bottom: 0.23em;
      line-height: 1.47;
    }

    ul > li:last-child,
    ol > li:last-child {
      margin-bottom: 0;
    }

    ul ul,
    ol ul,
    ul ol,
    ol ol {
      margin-top: 0.15em;
      margin-bottom: 0.1em;
      margin-left: 1.4em;
    }

    ul ul > li,
    ol ul > li,
    ul ol > li,
    ol ol > li {
      margin-bottom: 0.15em;
      line-height: 1.3;
    }
  </style>

  <!-- MathJax Config -->
  <script type="text/x-mathjax-config">
    MathJax.Hub.Config({
      TeX: {
        equationNumbers: { autoNumber: "all" }
      },
      tex2jax: {
        inlineMath: [['$','$'], ['\\(','\\)']],
        processEscapes: true
      }
    });
  </script>

  <!-- MathJax Core -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML"
    async>
  </script>
</head>
